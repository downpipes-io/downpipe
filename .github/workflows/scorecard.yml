# OpenSSF Scorecard: weekly supply-chain posture scan. Publishes results to the
# code-scanning dashboard and (on the default branch) to the public Scorecard API
# that backs the README badge. Advisory; it does not gate merges.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 18 * * 0" # weekly, Sundays 18:41 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard analysis
    # OSSF Scorecard scores PUBLIC supply chains. On a private repo its action cannot even check the code
    # out ("Repository not found"), and it had failed every run since it was added. A permanently red
    # workflow is worse than none: it teaches the reader that red here means nothing, which is the last
    # thing to teach about a security job. It SKIPS while private and starts running by itself if the
    # repo is ever made public. No token and no settings change either way.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results to the public OpenSSF API (badge source)
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true # required to populate the README badge on the default branch
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
