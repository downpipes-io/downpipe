# OpenSSF Scorecard: weekly supply-chain posture scan. Publishes results to the
# code-scanning dashboard and (on the default branch) to the public Scorecard API
# that backs the README badge. Advisory; it does not gate merges.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1" # weekly, Mondays 05:41 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard analysis
    # OSSF Scorecard scores PUBLIC supply chains. On a private repo its action cannot even check the code
    # out ("Repository not found"), and it had failed every run since it was added. A permanently red
    # workflow is worse than none: it teaches the reader that red here means nothing, which is the last
    # thing to teach about a security job. It SKIPS while private and starts running by itself if the
    # repo is ever made public. No token and no settings change either way.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results to the public OpenSSF API (badge source)
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - name: Run analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true # required to populate the README badge on the default branch
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
