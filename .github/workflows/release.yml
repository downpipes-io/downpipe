# Release the downpipe CLI. Dispatch-only: triggers on a v* tag (or manual
# workflow_dispatch). verify-tag first checks the tag's SSH signature against
# .github/allowed_signers as committed on main, failing closed on an unsigned tag or a
# key not on the roster (mirrors engine/console-private-archive's verify-tag job). Only
# then does the full suite + govulncheck run, GoReleaser build reproducible
# multi-platform binaries with a checksums file, a CycloneDX SBOM, and a keyless cosign
# attestation of the checksums, and open a DRAFT release the maintainer reviews and
# publishes. CI (ci.yml) keeps gating every push/PR; this only runs for tags.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialise releases per ref; never cancel an in-flight release (a half-published
# tag is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  GOVULNCHECK_VERSION: "v1.4.0" # pinned off @latest for reproducible releases
  CYCLONEDX_GOMOD_VERSION: "v1.10.0" # pinned off @latest for reproducible releases

jobs:
  verify-tag:
    name: Verify the release tag signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify the tag against the signer roster committed on main
        # Mirrors the engine and console private-archive repos' verify-tag job. The roster is read
        # from origin/main, NEVER from the tag's own tree: a pushed tag that bundles its own
        # allowed_signers must not be able to vouch for itself. Adding or rotating a
        # release-signing key is therefore a reviewed main-branch change. This fails closed when
        # the tag is unsigned or signed by a key not on the roster.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The checkout above is a full one (fetch-depth 0), so origin/main is already here; a
          # second fetch would need credentials the checkout deliberately does not persist
          # (persist-credentials false).
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main is missing from the checkout; the roster cannot be read"; exit 1; }
          git show origin/main:.github/allowed_signers > "${RUNNER_TEMP}/allowed_signers"
          if ! grep -qE '^[^#[:space:]]' "${RUNNER_TEMP}/allowed_signers"; then
            echo "::error::.github/allowed_signers on main carries no signer entries yet; add the release-signing SSH public key (see the comment at the top of that file) before cutting a release."
            exit 1
          fi
          git -c gpg.ssh.allowedSignersFile="${RUNNER_TEMP}/allowed_signers" verify-tag "$TAG"
          echo "tag $TAG verified against the main-branch signer roster"

  release:
    name: Build, attest & draft release
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release + upload assets
      id-token: write # OIDC identity for keyless cosign attestation + build provenance
      attestations: write # store the SLSA build-provenance attestation
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        # egress-policy stays audit until the release egress is baselined; switch to
        # block with an allow-list once a clean baseline run exists (deferred follow-up).
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: Vulnerability scan
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      - name: Test (race)
        run: go test -race -shuffle=on ./...

      - name: Install SBOM + signing tooling
        run: |
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA Build L2 provenance over the released binaries. cosign already signs the
      # checksums blob; this attests every artefact the GoReleaser run produced under
      # dist/ so a verifier can prove which workflow built each binary.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Subject hashes for the SLSA3 provenance job below (slsa-github-generator's documented
      # GoReleaser recipe): read the checksum digests GoReleaser already recorded per artefact
      # rather than re-hash anything.
      - name: Generate subject hashes for SLSA3 provenance
        id: hash
        env:
          ARTIFACTS: ${{ steps.run-goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          hashes=$(echo "$ARTIFACTS" | jq --raw-output '.[] | {name, "digest": (.extra.Digest // .extra.Checksum)} | select(.digest) | {digest} + {name} | join("  ") | sub("^sha256:";"")' | base64 -w0)
          if [ -z "$hashes" ]; then
            checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
            hashes=$(cat "$checksum_file" | base64 -w0)
          fi
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read # to read the workflow path
      id-token: write # to sign the provenance
      contents: write # to attach the provenance to the draft release
    # PINNING EXCEPTION (recorded): the SLSA generator must be pinned by TAG, not commit SHA; the
    # slsa-verifier refuses provenance minted from a SHA-pinned generator ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true # attach to the draft release GoReleaser created for this tag
      provenance-name: downpipe.intoto.jsonl
