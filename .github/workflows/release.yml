# Release the downpipe CLI. Dispatch-only: triggers on a v* tag (or manual
# workflow_dispatch). verify-tag first checks the tag's SSH signature against
# .github/allowed_signers as committed on main, failing closed on an unsigned tag or a
# key not on the roster (the engine and console use the same verify-tag job). Only
# then does the full suite + govulncheck run, GoReleaser build reproducible
# multi-platform binaries with a checksums file, a CycloneDX SBOM, and a keyless cosign
# attestation of the checksums, and open a DRAFT release the maintainer reviews and
# publishes. CI (ci.yml) keeps gating every push/PR; this only runs for tags.
# The SLSA provenance goes on that same draft by release id (attach-provenance), and that job fails
# unless the tag then has exactly one release, still a draft, holding exactly the expected files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialise releases per ref; never cancel an in-flight release (a half-published
# tag is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9"
  GOVULNCHECK_VERSION: "v1.4.0" # pinned off @latest for reproducible releases
  CYCLONEDX_GOMOD_VERSION: "v1.10.0" # pinned off @latest for reproducible releases

jobs:
  verify-tag:
    name: Verify the release tag signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify the tag against the signer roster committed on main
        # The engine and console use the same verify-tag job. The roster is read
        # from origin/main, NEVER from the tag's own tree: a pushed tag that bundles its own
        # allowed_signers must not be able to vouch for itself. Adding or rotating a
        # release-signing key is therefore a reviewed main-branch change. This fails closed when
        # the tag is unsigned or signed by a key not on the roster.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The checkout above is a full one (fetch-depth 0), so origin/main is already here; a
          # second fetch would need credentials the checkout deliberately does not persist
          # (persist-credentials false).
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main is missing from the checkout; the roster cannot be read"; exit 1; }
          git show origin/main:.github/allowed_signers > "${RUNNER_TEMP}/allowed_signers"
          if ! grep -qE '^[^#[:space:]]' "${RUNNER_TEMP}/allowed_signers"; then
            echo "::error::.github/allowed_signers on main carries no signer entries yet; add the release-signing SSH public key (see the comment at the top of that file) before cutting a release."
            exit 1
          fi
          git -c gpg.ssh.allowedSignersFile="${RUNNER_TEMP}/allowed_signers" verify-tag "$TAG"
          echo "tag $TAG verified against the main-branch signer roster"
      - name: Tag commit must be on main
        # The script and its guard library are read from origin/main, never the tag's own tree, for the
        # same reason as the roster above. It refuses a signed tag whose commit is not an ancestor of
        # origin/main (for example a pull request head), so only a commit on main can build a release.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tagcheck"
          git archive origin/main scripts/verify-tag-on-main.sh scripts/lib/verdict-guard.sh | tar -x -C "${RUNNER_TEMP}/tagcheck"
          bash "${RUNNER_TEMP}/tagcheck/scripts/verify-tag-on-main.sh" "${GITHUB_REF_NAME}"

  release:
    name: Build, attest & draft release
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release + upload assets
      id-token: write # OIDC identity for keyless cosign attestation + build provenance
      attestations: write # store the SLSA build-provenance attestation
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        # egress-policy stays audit until the release egress is baselined; switch to
        # block with an allow-list once a clean baseline run exists (deferred follow-up).
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: Vulnerability scan
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      - name: Test (race)
        run: go test -race -shuffle=on ./...

      - name: Install SBOM + signing tooling
        run: |
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned: the installer's default cosign moved from 2 to 3 with v4 and changed
          # sign-blob's output form under the release; a release tool never floats here.
          cosign-release: v3.1.3

      - name: GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned exactly, like every other action here: "~> v2" let the release tooling
          # change between two Sunday trains without a commit.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA Build L2 provenance over the released binaries. cosign already signs the
      # checksums blob; this attests every artefact the GoReleaser run produced under
      # dist/ so a verifier can prove which workflow built each binary.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Subject hashes for the SLSA3 provenance job below (slsa-github-generator's documented
      # GoReleaser recipe): read the checksum digests GoReleaser already recorded per artefact
      # rather than re-hash anything.
      - name: Generate subject hashes for SLSA3 provenance
        id: hash
        env:
          ARTIFACTS: ${{ steps.run-goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          hashes=$(echo "$ARTIFACTS" | jq --raw-output '.[] | {name, "digest": (.extra.Digest // .extra.Checksum)} | select(.digest) | {digest} + {name} | join("  ") | sub("^sha256:";"")' | base64 -w0)
          if [ -z "$hashes" ]; then
            checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
            hashes=$(cat "$checksum_file" | base64 -w0)
          fi
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read # to read the workflow path
      id-token: write # to sign the provenance
      # The generator's own upload job declares contents: write, and a called workflow cannot declare more
      # than its caller grants, so this stays write although that job does not run here.
      contents: write # declared by the generator's upload job, which upload-assets false skips
    # PINNING EXCEPTION (recorded): the SLSA generator must be pinned by TAG, not commit SHA; the
    # slsa-verifier refuses provenance minted from a SHA-pinned generator ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      # false, because the generator's upload step does not find a draft by its tag: given true, it publishes
      # a second release for the tag holding only the provenance, beside the GoReleaser draft that holds
      # everything else. The attach-provenance job below puts the provenance on that draft by release id.
      upload-assets: false
      provenance-name: downpipe.intoto.jsonl

  attach-provenance:
    name: Attach provenance to the draft release
    needs: [release, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # list releases with drafts included, and upload the provenance to the draft
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The generator uploads the signed provenance as a workflow artefact named by its provenance-name
      # output, whatever upload-assets says.
      - name: Download the signed provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ${{ runner.temp }}/provenance
      # By release id, never by tag: a lookup by tag does not return a draft, which is how an upload by tag
      # lands on a second release. scripts/release-shape.sh draft-id fails unless the tag has exactly one
      # release, drafts included, and that release is a draft. A provenance file already on the draft with
      # this digest is left as it is, so a re-run of this job does not fail on its own upload; one with
      # another digest fails.
      - name: Attach the provenance to the GoReleaser draft by release id
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/provenance/${PROVENANCE_NAME}"
          if [ ! -s "$file" ]; then
            echo "::error::the generator's artefact holds no ${PROVENANCE_NAME}"
            exit 1
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s 'add // []' > "${RUNNER_TEMP}/releases-before.json"
          ./scripts/release-shape.sh draft-id --tag "$TAG" --releases "${RUNNER_TEMP}/releases-before.json" --write-id "${RUNNER_TEMP}/draft-id"
          id="$(cat "${RUNNER_TEMP}/draft-id")"
          local_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          attached="$(jq -r --argjson id "$id" --arg name "$PROVENANCE_NAME" \
            '.[] | select(.id == $id) | .assets[] | select(.name == $name) | (.digest // "none")' \
            "${RUNNER_TEMP}/releases-before.json")"
          if [ -z "$attached" ]; then
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}/assets?name=${PROVENANCE_NAME}" \
              --input "$file" > "${RUNNER_TEMP}/upload.json"
            echo "uploaded ${PROVENANCE_NAME} to draft release ${id}: $(jq -r '.digest // "the API returned no digest"' "${RUNNER_TEMP}/upload.json")"
          elif [ "$attached" = "$local_digest" ]; then
            echo "draft release ${id} already holds ${PROVENANCE_NAME} with digest ${local_digest}"
          else
            echo "::error::draft release ${id} already holds a ${PROVENANCE_NAME} with digest ${attached}, not this run's ${local_digest}"
            exit 1
          fi
      # Read every release back and check the shape: exactly one release for the tag, still a draft, holding
      # exactly the expected files (derived from .goreleaser.yaml), and the provenance on it carrying the
      # digest of the file this run downloaded. The draft is left as a draft for the maintainer to publish.
      - name: Check the draft holds exactly the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s 'add // []' > "${RUNNER_TEMP}/releases-after.json"
          ./scripts/release-shape.sh check --tag "$TAG" --releases "${RUNNER_TEMP}/releases-after.json" \
            --state draft --provenance "${RUNNER_TEMP}/provenance/${PROVENANCE_NAME}"
