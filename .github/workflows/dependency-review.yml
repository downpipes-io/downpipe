# Dependency review on pull requests: blocks a PR that introduces a dependency with a
# known high-or-worse advisory, or a disallowed licence. Runs only on PRs because it
# diffs the base ref against the head ref.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          # The reader is MIT and its dependency tree is permissive; copyleft and other
          # strong-reciprocal licences are not expected in a vendored Go tree.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-3.0
