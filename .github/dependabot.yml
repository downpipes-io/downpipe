version: 2
# Version updates run on Saturday evening, Melbourne time, so no pull request opens on a weekday.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly, day: saturday, time: "20:00", timezone: "Australia/Melbourne" }
    groups:
      gomod:
        patterns:
          - "*"
      gomod-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: saturday, time: "20:00", timezone: "Australia/Melbourne" }
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
